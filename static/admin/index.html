<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2C1810" />
<title>SweetLab — Адмін-панель</title>
<style>
  :root{
    --cocoa:#2C1810; --cocoa-2:#3E2723; --cocoa-3:#5D4037;
    --caramel:#BC6C25; --caramel-2:#D4A373;
    --cream:#FAF6F2; --cream-2:#F4ECE6; --line:#EDE2DA; --muted:#96796A;
    --ok:#2E7D32; --err:#C62828; --warn:#B26A00;
    --r:18px; --r-sm:12px;
    --sh:0 2px 10px rgba(44,24,16,.05); --sh-md:0 10px 30px rgba(44,24,16,.10);
    --ease:cubic-bezier(.22,.8,.28,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--cream);color:var(--cocoa);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .layout{display:flex;min-height:100vh}

  aside{width:240px;flex:0 0 240px;background:linear-gradient(180deg,#2C1810,#1E0F0A);
    color:#F7EEE8;padding:22px 16px;display:flex;flex-direction:column;justify-content:space-between;
    position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px;letter-spacing:.2px;padding:0 8px 22px}
  .logo .badge{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:16px;
    background:linear-gradient(145deg,var(--caramel),#7E4413);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  nav{display:grid;gap:6px}
  .nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;cursor:pointer;font-family:inherit;
    background:transparent;color:#C4AEA2;font-size:13px;font-weight:700;text-align:left;
    padding:12px 14px;border-radius:13px;transition:all .22s var(--ease)}
  .nav-btn:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px)}
  .nav-btn.on{background:linear-gradient(135deg,var(--caramel),#9A5216);color:#fff;box-shadow:0 8px 22px rgba(188,108,37,.35)}
  .nav-btn .ic{font-size:15px}
  .side-foot{font-size:10.5px;color:#7A5F53;padding:0 8px;line-height:1.6}

  main{flex:1;min-width:0;padding:26px 30px 40px;max-width:1500px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .page-head h1{margin:0;font-size:24px;letter-spacing:-.5px}
  .page-head p{margin:5px 0 0;font-size:12.5px;color:var(--muted)}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--ok);
    background:#E7F4E8;padding:7px 12px;border-radius:999px}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,125,50,.45)}70%{box-shadow:0 0 0 8px rgba(46,125,50,0)}100%{box-shadow:0 0 0 0 rgba(46,125,50,0)}}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;
    box-shadow:var(--sh);transition:transform .22s var(--ease),box-shadow .25s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
  .card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .card .lbl{font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .card .ico{font-size:17px}
  .card .val{font-size:29px;font-weight:900;letter-spacing:-1px;color:var(--cocoa-3);line-height:1.1}
  .card .sub{font-size:11px;color:var(--muted);margin-top:5px;font-weight:600}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
    overflow:hidden;margin-bottom:16px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#FFFDFB,#FCF7F3)}
  .panel-head h2{margin:0;font-size:15px;font-weight:900}
  .panel-head .hint{font-size:11px;color:var(--muted);font-weight:600}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
  thead th{text-align:left;padding:12px 14px;font-size:9.5px;font-weight:900;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);background:#FCF8F5;border-bottom:1px solid var(--line);
    white-space:nowrap}
  tbody td{padding:11px 14px;border-bottom:1px solid #F5EDE7;vertical-align:middle}
  tbody tr{transition:background .18s}
  tbody tr:hover{background:#FDF9F6}
  tbody tr:last-child td{border-bottom:0}
  .mono{font-variant-numeric:tabular-nums}
  .nowrap{white-space:nowrap}
  .ing-name{line-height:1.35;min-width:150px;max-width:210px}
  .strong{font-weight:900}
  .price{font-weight:900;color:var(--caramel);white-space:nowrap}
  .recipe-name{font-weight:800;font-size:12.5px}
  .recipe-sub{font-size:11px;color:var(--muted);margin-top:2px}

  .badge{font-size:10px;font-weight:900;letter-spacing:.03em;padding:5px 10px;border-radius:999px;
    white-space:nowrap;display:inline-block}
  .b-created{background:#FFF1D6;color:#8A5A00}.b-preparing{background:#DCEBFF;color:#0B4A8F}
  .b-delivering{background:#EADFFF;color:#5A2CA0}.b-completed{background:#DDF3DF;color:#1E5E23}

  input[type="text"],input[type="number"],select{
    font-family:inherit;font-size:12px;font-weight:700;color:var(--cocoa);
    border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;
    outline:none;transition:border-color .2s,box-shadow .2s;
  }
  input[type="text"]:focus,input[type="number"]:focus,select:focus{
    border-color:var(--caramel);box-shadow:0 0 0 3px rgba(188,108,37,.13)}
  input[type="number"]{width:82px}
  input[data-name]{width:100%;min-width:140px}
  input[data-price]{width:84px}
  input[data-stock]{width:78px}
  .new-name{min-width:190px;flex:1}

  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;
    border-radius:10px;padding:8px 13px;transition:transform .16s var(--ease),background .2s,box-shadow .2s}
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .btn-solid{background:linear-gradient(140deg,var(--caramel),#A05615);color:#fff;box-shadow:0 5px 14px rgba(188,108,37,.3)}
  .btn-solid:hover{box-shadow:0 8px 20px rgba(188,108,37,.38)}
  .btn-soft{background:var(--cream-2);color:var(--cocoa-2)}
  .btn-soft:hover{background:#ECDFD5}
  .btn-danger{background:#FDECEC;color:var(--err)}
  .toggle{display:inline-flex;align-items:center;gap:0;background:none;border:0;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:900;color:var(--muted);padding:0}
  .switch{width:36px;height:20px;border-radius:999px;background:#DCD0C8;position:relative;transition:background .25s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
  .switch.on{background:var(--ok)}
  .switch.on::after{transform:translateX(16px)}

  .stock-ok{font-weight:900;color:var(--ok)}.stock-low{font-weight:900;color:var(--err)}
  .cat{font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 8px;border-radius:7px;background:var(--cream-2);color:var(--cocoa-3);white-space:nowrap}
  .inline{display:flex;align-items:center;gap:7px;flex-wrap:nowrap}
  .add-form{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:14px 20px;background:#FFFBF8}
  .add-form .field{display:grid;gap:4px}
  .add-form label{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .group-title{display:flex;align-items:center;gap:9px;padding:12px 20px;background:#FDF8F4;
    border-bottom:1px solid var(--line);font-size:12px;font-weight:900}
  .group-title span{font-size:15px}

  .empty{padding:52px 20px;text-align:center;color:var(--muted);font-size:13px;font-weight:600}
  .skeleton{height:13px;border-radius:7px;background:linear-gradient(90deg,#F1E7E0,#FAF4EF,#F1E7E0);
    background-size:200px 100%;animation:sh 1.15s linear infinite}
  @keyframes sh{0%{background-position:-200px 0}100%{background-position:200px 0}}
  .fade{animation:fade .35s var(--ease) both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .toast{position:fixed;right:22px;bottom:22px;z-index:90;background:var(--cocoa-2);color:#fff;
    font-size:12.5px;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:var(--sh-md);
    opacity:0;transform:translateY(12px);transition:all .3s var(--ease);pointer-events:none}
  .toast.show{opacity:1;transform:none}.toast.err{background:var(--err)}

  @media (max-width:820px){
    .layout{flex-direction:column}
    aside{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;
      justify-content:space-between;padding:12px 14px;gap:12px}
    .logo{padding:0;font-size:13px}
    nav{display:flex;gap:6px;overflow-x:auto}
    .nav-btn{white-space:nowrap;padding:9px 12px;font-size:12px}
    .side-foot{display:none}
    main{padding:18px 14px 32px}
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div>
      <div class="logo"><span class="badge">🍫</span> SweetLab Admin</div>
      <nav id="nav">
        <button class="nav-btn on" data-tab="dashboard"><span class="ic">📊</span> Дашборд</button>
        <button class="nav-btn" data-tab="orders"><span class="ic">📦</span> Замовлення</button>
        <button class="nav-btn" data-tab="ingredients"><span class="ic">🌿</span> Асортимент</button>
      </nav>
    </div>
    <div class="side-foot">SweetLab Admin v1.1<br/>Автооновлення кожні 15 с</div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '/api';
const STATUS = {
  created:['Створено','b-created'],
  preparing:['Готується','b-preparing'],
  delivering:['В дорозі','b-delivering'],
  completed:['Виконано','b-completed'],
};
const GROUPS = [
  {key:'base',    title:'Шоколад (основа)', icon:'🍫'},
  {key:'filling', title:'Начинки',          icon:'🥜'},
  {key:'topping', title:'Декор',            icon:'✨'},
];
const CAT_LABEL = {base:'Шоколад', filling:'Начинка', topping:'Декор'};

const state = {tab:'dashboard', stats:{usersCount:0,ordersCount:0,orders:[]}, ingredients:[], loading:true, error:null};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => `${Number(n||0).toFixed(0)} грн`;
const el = (id) => document.getElementById(id);
const q = (sel) => document.querySelector(sel);

function toast(msg, isErr){
  const t = el('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2400);
}
async function api(path, options){
  const res = await fetch(API + path, options);
  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try { detail = (await res.json()).detail || detail; } catch(_) {}
    throw new Error(detail);
  }
  return res.json();
}
const jsonHeaders = { 'Content-Type':'application/json' };

/* ----------------------------- Дані ----------------------------- */
async function load(showLoader){
  if (showLoader && state.loading) render();
  try {
    const [stats, ingredients] = await Promise.all([api('/admin/stats'), api('/admin/ingredients')]);
    state.stats = stats;
    state.ingredients = ingredients;
    state.error = null;
  } catch (e) {
    state.error = 'Немає зв’язку з API. Перевір, чи запущений сервер.';
  } finally {
    state.loading = false;
    render();
  }
}

/* ----------------------------- Рендер ----------------------------- */
function render(){
  if (state.loading) {
    el('main').innerHTML = `<div class="page-head"><div><h1>Завантаження…</h1></div></div>
      <div class="cards">${'<div class="card"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:40%;height:26px;margin-top:12px"></div></div>'.repeat(4)}</div>`;
    return;
  }
  const views = {dashboard:viewDashboard, orders:viewOrders, ingredients:viewIngredients};
  el('main').innerHTML = (views[state.tab] || viewDashboard)();
  bind();
}

function viewDashboard(){
  const {usersCount, ordersCount, orders} = state.stats;
  const revenue = orders.reduce((s,o) => s + (o.totalPrice || 0), 0);
  const active = orders.filter(o => o.status !== 'completed').length;
  const avg = ordersCount ? revenue / ordersCount : 0;
  const cards = [
    {l:'Користувачів', v:usersCount, ico:'👥', sub:'всього у боті'},
    {l:'Замовлень', v:ordersCount, ico:'📦', sub:`${active} активних`},
    {l:'Виручка', v:money(revenue), ico:'💰', sub:`середній чек ${money(avg)}`},
    {l:'Позицій асортименту', v:state.ingredients.length, ico:'🌿',
      sub:`${state.ingredients.filter(i => i.stock < 30).length} з низьким залишком`},
  ].map(c => `<div class="card"><div class="top"><span class="lbl">${c.l}</span><span class="ico">${c.ico}</span></div>
    <div class="val">${c.v}</div><div class="sub">${c.sub}</div></div>`).join('');

  const recent = orders.slice(0,6);
  const list = recent.length
    ? `<div class="scroll"><table><thead><tr><th>ID</th><th>Клієнт</th><th>Рецепт</th><th>Сума</th><th>Статус</th></tr></thead><tbody>
      ${recent.map(o => {
        const [label, cls] = STATUS[o.status] || ['—','b-created'];
        return `<tr><td class="mono strong">#${o.id}</td>
          <td>${esc(o.user?.firstName || o.user?.username || '—')}</td>
          <td><div class="recipe-name">${esc(o.recipe?.name || '—')}</div>
            <div class="recipe-sub">${esc(o.recipe?.base?.name || '')}</div></td>
          <td class="price">${money(o.totalPrice)}</td>
          <td><span class="badge ${cls}">${label}</span></td></tr>`;
      }).join('')}</tbody></table></div>`
    : `<div class="empty">Замовлень ще немає 🍫</div>`;

  return `<div class="fade">
    <div class="page-head"><div><h1>Дашборд</h1><p>Огляд бізнесу в реальному часі</p></div>
      <span class="live"><span class="pulse"></span> LIVE</span></div>
    <div class="cards">${cards}</div>
    <div class="panel"><div class="panel-head"><h2>Останні замовлення</h2><span class="hint">${orders.length} всього</span></div>
      ${list}</div></div>`;
}

function viewOrders(){
  const orders = state.stats.orders;
  if (!orders.length) return `<div class="fade">
    <div class="page-head"><div><h1>Замовлення</h1><p>Керування статусами</p></div></div>
    <div class="panel"><div class="empty">Замовлень ще немає 🍫</div></div></div>`;
  return `<div class="fade">
    <div class="page-head"><div><h1>Замовлення</h1><p>Змінюй статус — клієнт побачить оновлення у застосунку</p></div>
      <span class="live"><span class="pulse"></span> ${orders.length} записів</span></div>
    <div class="panel"><div class="panel-head"><h2>Черга замовлень</h2><span class="hint">оновлюється автоматично</span></div>
    <div class="scroll"><table><thead><tr><th>ID</th><th>Клієнт</th><th>Рецепт</th><th>Сума</th><th>Статус</th><th>Змінити</th></tr></thead><tbody>
      ${orders.map(o => {
        const [label, cls] = STATUS[o.status] || ['—','b-created'];
        const fills = (o.recipe?.fillings || []).map(f => f.name).join(', ');
        return `<tr><td class="mono strong">#${o.id}</td>
          <td><div class="strong">${esc(o.user?.firstName || o.user?.username || '—')}</div>
            <div class="recipe-sub">${esc(o.user?.username ? '@' + o.user.username : '')}</div></td>
          <td><div class="recipe-name">${esc(o.recipe?.name || '—')}</div>
            <div class="recipe-sub">${esc(o.recipe?.base?.name || '')}${fills ? ' · ' + esc(fills) : ''}</div></td>
          <td class="price">${money(o.totalPrice)}</td>
          <td><span class="badge ${cls}">${label}</span></td>
          <td><select data-order="${o.id}">${Object.entries(STATUS).map(([k,[l]]) =>
            `<option value="${k}" ${o.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></td></tr>`;
      }).join('')}</tbody></table></div></div></div>`;
}

function categoryOptions(selected){
  return Object.entries(CAT_LABEL).map(([k,v]) =>
    `<option value="${k}" ${selected === k ? 'selected' : ''}>${v}</option>`).join('');
}

function ingredientRow(i){
  return `<tr>
    <td><input type="text" data-name="${i.id}" value="${esc(i.name)}" maxlength="100" /></td>
    <td><select data-category="${i.id}">${categoryOptions(i.category)}</select></td>
    <td><input type="number" min="0" step="1" data-price="${i.id}" value="${i.price}" /></td>
    <td class="mono"><span class="${i.stock < 30 ? 'stock-low' : 'stock-ok'}">${i.stock} од.</span></td>
    <td><input type="number" min="0" step="1" data-stock="${i.id}" value="${i.stock}" /></td>
    <td><button class="toggle" data-toggle="${i.id}" title="Увімкнути/вимкнути">
      <span class="switch ${i.is_active ? 'on' : ''}" data-active-toggle="${i.id}"></span></button></td>
    <td><div class="inline">
      <button class="btn btn-solid" data-save="${i.id}">Зберегти</button>
      <button class="btn btn-danger" data-delete="${i.id}" title="Видалити">✕</button>
    </div></td></tr>`;
}

function viewIngredients(){
  const low = state.ingredients.filter(i => i.stock < 30);
  const groups = GROUPS.map(g => {
    const items = state.ingredients.filter(i => i.category === g.key);
    if (!items.length && g.key !== 'base') return '';
    return `<div class="group-title"><span>${g.icon}</span> ${g.title} <span class="hint">${items.length}</span></div>
      ${items.length ? `<div class="scroll"><table><thead><tr>
        <th>Назва</th><th>Категорія</th><th>Ціна, грн</th><th>Залишок</th><th>Новий залишок</th>
        <th>Доступно</th><th>Дії</th></tr></thead><tbody>
        ${items.map(ingredientRow).join('')}</tbody></table></div>`
        : `<div class="empty">Тут поки порожньо — додай першу позицію нижче</div>`}`;
  }).join('');

  return `<div class="fade">
    <div class="page-head"><div><h1>Асортимент і ціни</h1>
      <p>Редагуй назви, ціни та залишки. Додавай нові начинки, декор і шоколад.</p></div>
      <span class="live"><span class="pulse"></span> ${state.ingredients.length} позицій</span></div>
    <div class="panel">
      <div class="panel-head"><h2>Нова позиція</h2><span class="hint">після додавання одразу з'явиться в міні-грі</span></div>
      <div class="add-form">
        <div class="field"><label>Назва</label><input class="new-name" id="new-name" type="text" maxlength="100" placeholder="Наприклад, Фісташки" /></div>
        <div class="field"><label>Категорія</label><select id="new-category">${categoryOptions('base')}</select></div>
        <div class="field"><label>Ціна, грн</label><input id="new-price" type="number" min="0" step="1" value="20" /></div>
        <div class="field"><label>Залишок</label><input id="new-stock" type="number" min="0" step="1" value="100" /></div>
        <button class="btn btn-solid" data-act="add">＋ Додати</button>
      </div>
    </div>
    ${low.length ? `<div class="panel"><div class="panel-head"><h2>⚠️ Низький залишок</h2>
      <span class="hint">менше 30 од.</span></div><div class="empty" style="padding:14px">${low.map(i => esc(i.name)).join(', ')}</div></div>` : ''}
    <div class="panel">
      <div class="panel-head"><h2>Поточні позиції</h2><span class="hint">зміни зберігаються кнопкою «Зберегти»</span></div>
      ${groups}
    </div></div>`;
}

/* ----------------------------- Події ----------------------------- */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === btn));
      state.tab = btn.dataset.tab;
      render();
    });
  });
  document.querySelectorAll('[data-order]').forEach(sel => {
    sel.addEventListener('change', async () => {
      try {
        await api(`/admin/orders/${sel.dataset.order}/status`, {
          method:'PATCH', headers:jsonHeaders,
          body:JSON.stringify({status:sel.value}),
        });
        toast('Статус оновлено');load(false);
      } catch(e) { toast('Не вдалося оновити статус', true); load(false); }
    });
  });
  document.querySelectorAll('[data-act="add"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = q('#new-name')?.value.trim();
      if (!name) { toast('Вкажи назву', true); return; }
      const payload = {
        name,
        category:q('#new-category').value,
        price:Math.max(0, Number(q('#new-price').value || 0)),
        stock:Math.max(0, parseInt(q('#new-stock').value || '0', 10)),
      };
      btn.disabled = true;
      try {
        await api('/admin/ingredients', {method:'POST', headers:jsonHeaders, body:JSON.stringify(payload)});
        toast('Позицію додано');load(false);
      } catch(e) { toast(e.message || 'Не вдалося додати', true); btn.disabled = false; }
    });
  });
  document.querySelectorAll('[data-save]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.save;
      const payload = {
        name:q(`[data-name="${id}"]`).value.trim(),
        category:q(`[data-category="${id}"]`).value,
        price:Math.max(0, Number(q(`[data-price="${id}"]`).value || 0)),
        stock:Math.max(0, parseInt(q(`[data-stock="${id}"]`).value || '0', 10)),
        is_active:q(`[data-active-toggle="${id}"]`).classList.contains('on'),
      };
      if (!payload.name) { toast('Назва не може бути порожньою', true); return; }
      btn.disabled = true;
      try {
        await api(`/admin/ingredients/${id}`, {method:'PATCH', headers:jsonHeaders, body:JSON.stringify(payload)});
        toast('Збережено');load(false);
      } catch(e) { toast(e.message || 'Не вдалося зберегти', true); btn.disabled = false; }
    });
  });
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.toggle;
      const item = state.ingredients.find(i => String(i.id) === String(id));
      if (!item) return;
      try {
        await api(`/admin/ingredients/${id}`, {
          method:'PATCH', headers:jsonHeaders, body:JSON.stringify({is_active:!item.is_active}),
        });
        toast(item.is_active ? 'Позицію вимкнено' : 'Позицію активовано');load(false);
      } catch(e) { toast('Не вдалося змінити доступність', true); }
    });
  });
  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.delete;
      const item = state.ingredients.find(i => String(i.id) === String(id));
      if (!confirm(`Видалити «${item?.name || 'позицію'}» з асортименту?`)) return;
      try {
        await api(`/admin/ingredients/${id}`, {method:'DELETE'});
        toast('Позицію видалено');load(false);
      } catch(e) { toast('Не вдалося видалити', true); }
    });
  });
}

/* ----------------------------- Старт ----------------------------- */
render();
load(true);
setInterval(() => {
  if (!document.hidden && !q('input:focus, select:focus')) load(false);
}, 15000);
</script>
</body>
</html>

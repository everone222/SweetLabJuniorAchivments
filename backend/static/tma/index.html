<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3E2723" />
<title>SweetLab — Шоколадна майстерня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --cocoa:#3E2723; --cocoa-2:#5D4037; --caramel:#BC6C25; --caramel-soft:#D4A373;
    --cream:#FCF8F5; --cream-2:#F3EAE3; --line:#EADFD7; --muted:#9A7C6B;
    --ok:#2E7D32; --warn:#B26A00;
    --r-lg:26px; --r-md:18px; --r-sm:12px;
    --shadow-sm:0 2px 10px rgba(62,39,35,.06);
    --shadow-md:0 8px 28px rgba(62,39,35,.10);
    --shadow-lg:0 14px 40px rgba(62,39,35,.16);
    --ease:cubic-bezier(.22,.8,.28,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #F7EDE5 0%, transparent 60%),
      var(--cream);
    color:var(--cocoa);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:470px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header.top{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;
    background:linear-gradient(180deg,rgba(62,39,35,.98),rgba(62,39,35,.92));
    backdrop-filter:blur(10px);
    color:#FCF8F5;border-bottom-left-radius:22px;border-bottom-right-radius:22px;
    box-shadow:var(--shadow-md);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.2px;font-size:15px}
  .brand .dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--caramel),#8A4E17);font-size:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .who{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);
    max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{flex:1;padding:16px 16px 132px}
  .screen{animation:rise .42s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes shimmer{0%{background-position:-220px 0}100%{background-position:220px 0}}

  /* Hero */
  .hero{text-align:center;padding:26px 8px 6px}
  .hero .gift{font-size:64px;line-height:1;animation:floaty 3.4s ease-in-out infinite;
    filter:drop-shadow(0 10px 18px rgba(188,108,37,.28))}
  .hero h1{font-size:25px;line-height:1.2;margin:16px 0 8px;letter-spacing:-.4px}
  .hero p{font-size:13.5px;color:var(--muted);margin:0 auto;max-width:330px;line-height:1.6}

  /* Buttons */
  .btn{
    width:100%;border:0;cursor:pointer;font-family:inherit;
    padding:15px 18px;border-radius:var(--r-md);font-size:15px;font-weight:800;
    transition:transform .18s var(--ease),box-shadow .25s var(--ease),background .25s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{transform:scale(.975)}
  .btn-primary{background:linear-gradient(160deg,#6D4C41,#3E2723);color:#fff;box-shadow:var(--shadow-md)}
  .btn-primary:hover{box-shadow:var(--shadow-lg)}
  .btn-ghost{background:var(--cream-2);color:var(--cocoa);box-shadow:var(--shadow-sm)}
  .btn-ghost:hover{background:#EBDFD6}
  .btn-sm{width:auto;padding:11px 16px;font-size:13px;border-radius:14px}
  .stack{display:grid;gap:10px}
  .mt{margin-top:22px}

  /* Preview card */
  .preview{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
    padding:16px;box-shadow:var(--shadow-sm)}
  .preview .label{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);text-align:center;margin-bottom:8px}
  .name-input{
    width:100%;border:0;border-bottom:2px solid var(--caramel-soft);background:transparent;
    text-align:center;font-family:inherit;font-size:18px;font-weight:800;color:var(--cocoa);
    padding:6px 2px 8px;outline:none;transition:border-color .25s;
  }
  .name-input:focus{border-color:var(--caramel)}
  .name-input::placeholder{color:#C9B3A4;font-weight:700}
  .bar{
    margin-top:14px;border-radius:var(--r-md);min-height:150px;padding:16px 14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    text-align:center;position:relative;overflow:hidden;
    transition:background .5s var(--ease),color .4s;
    box-shadow:inset 0 2px 14px rgba(0,0,0,.16), inset 0 -1px 0 rgba(255,255,255,.06);
    animation:pop .45s var(--ease) both;
  }
  .bar::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);
    background-size:260px 100%;background-repeat:no-repeat;
    animation:shimmer 4.6s linear infinite}
  .bar .base{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;opacity:.85}
  .bar .fills{font-size:12.5px;font-weight:700;line-height:1.5;max-width:100%}
  .bar .tops{font-size:11px;font-weight:600;opacity:.9;line-height:1.45}
  .bar .empty{font-size:12px;font-weight:600;opacity:.65}

  /* Section */
  .section{margin-top:22px}
  .section h3{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cocoa-2);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .section h3 .n{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;
    background:var(--cream-2);color:var(--cocoa-2);font-size:10.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .chip{
    border:1.5px solid var(--line);background:#fff;border-radius:var(--r-md);
    padding:12px 12px;text-align:left;cursor:pointer;font-family:inherit;
    transition:transform .18s var(--ease),border-color .2s,background .25s,box-shadow .25s;
    display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;
  }
  .chip:hover{border-color:#DCCCC0;box-shadow:var(--shadow-sm)}
  .chip:active{transform:scale(.97)}
  .chip .n{font-size:12.5px;font-weight:800;line-height:1.3;color:var(--cocoa)}
  .chip .p{font-size:11.5px;font-weight:900;color:var(--caramel)}
  .chip.on{border-color:var(--cocoa-2);background:linear-gradient(160deg,#F6EFE9,#EFE6DE);
    transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .chip.on::before{content:"✓";position:absolute;top:7px;right:9px;font-size:10px;font-weight:900;
    color:#fff;background:var(--cocoa-2);width:16px;height:16px;border-radius:50%;
    display:grid;place-items:center;animation:pop .3s var(--ease) both}
  .chip .stock{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#B9A091}
  .chip .stock.low{color:#C62828}
  .chip:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}

  /* Bottom bar */
  .bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    max-width:470px;margin:0 auto;
    background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    box-shadow:0 -10px 30px rgba(62,39,35,.08);
    animation:rise .35s var(--ease) both;
  }
  .bottom .sum small{display:block;font-size:9.5px;font-weight:900;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .bottom .sum b{font-size:21px;font-weight:900;letter-spacing:-.5px;color:var(--cocoa-2)}
  .actions{display:flex;gap:8px}

  /* Success */
  .success{text-align:center;padding:34px 6px}
  .success .emoji{font-size:66px;animation:pop .6s var(--ease) both;display:inline-block}

  /* Orders */
  .row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .row-head h2{font-size:20px;margin:0;letter-spacing:-.3px}
  .link{background:none;border:0;font-family:inherit;font-size:12.5px;font-weight:800;
    color:var(--caramel);cursor:pointer;padding:6px 0}
  .order{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
    padding:14px;box-shadow:var(--shadow-sm);animation:rise .35s var(--ease) both}
  .order+.order{margin-top:10px}
  .order .oh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
  .order .id{font-size:12.5px;font-weight:900}
  .badge{font-size:10px;font-weight:900;letter-spacing:.04em;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .b-created{background:#FFF1D6;color:#8A5A00}
  .b-preparing{background:#DCEBFF;color:#0B4A8F}
  .b-delivering{background:#EADFFF;color:#5A2CA0}
  .b-completed{background:#DDF3DF;color:#1E5E23}
  .order .meta{font-size:11.5px;color:var(--muted);line-height:1.65}
  .order .meta b{color:var(--cocoa)}
  .order .total{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;
    border-top:1px solid var(--cream-2);margin-top:10px;padding-top:9px}
  .order .total span:last-child{color:var(--caramel)}

  /* States */
  .empty{text-align:center;color:var(--muted);font-weight:600;font-size:13px;padding:56px 0}
  .skeleton{height:14px;border-radius:8px;
    background:linear-gradient(90deg,#EFE6DE 0%,#F8F1EB 50%,#EFE6DE 100%);
    background-size:220px 100%;animation:shimmer 1.2s linear infinite}
  .loader{display:grid;place-items:center;height:100vh;background:var(--cocoa);color:var(--cream);gap:14px}
  .loader .sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);
    border-top-color:var(--caramel-soft);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{
    position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);
    background:var(--cocoa);color:#fff;font-size:12.5px;font-weight:700;
    padding:11px 18px;border-radius:999px;box-shadow:var(--shadow-lg);
    opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:60;max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="dot">🍫</span> SweetLab</div>
    <div class="who" id="who">Гість</div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '/api';

const state = {
  step: 'welcome',
  ingredients: [],
  base: null,
  fillings: [],
  toppings: [],
  name: 'Моя крафтова плитка',
  orders: [],
  user: { id: 123456789, username: 'demo_user', first_name: 'Гість' },
  loading: true,
  error: null,
};

const INK = {
  dark:  { bg:'linear-gradient(160deg,#3B231C,#241410)', fg:'#FFF6EF' },
  milk:  { bg:'linear-gradient(160deg,#8B5E42,#6B4128)', fg:'#FFF8F1' },
  white: { bg:'linear-gradient(160deg,#FFFDFA,#F1E4D6)', fg:'#3B231C' },
  pink:  { bg:'linear-gradient(160deg,#E7A0A0,#C87A7A)', fg:'#3B1A1A' },
};

function baseInk(base){
  const n = (base?.name || '').toLowerCase();
  if (n.includes('чорн')) return INK.dark;
  if (n.includes('біл'))   return INK.white;
  if (n.includes('рожев') || n.includes('рубі')) return INK.pink;
  return INK.milk;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => `${Number(n).toFixed(0)} грн`;
const el = (id) => document.getElementById(id);

function toast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2200);
}

function haptic(type){
  try {
    const hf = window.Telegram?.WebApp?.HapticFeedback;
    if (!hf) return;
    if (type === 'success') hf.notificationOccurred('success');
    else hf.selectionChanged();
  } catch(_) {}
}

function total(){
  return (state.base?.price || 0)
    + state.fillings.reduce((s, i) => s + i.price, 0)
    + state.toppings.reduce((s, i) => s + i.price, 0);
}

async function api(path, options){
  const res = await fetch(API + path, options);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/* ----------------------------- Рендер ----------------------------- */
function render(){
  el('who').textContent = state.user.first_name || state.user.username || 'Гість';

  if (state.loading) {
    el('main').innerHTML = `
      <div class="loader">
        <div class="sp"></div>
        <div style="font-weight:800;font-size:14px">Відкриваємо майстерню…</div>
      </div>`;
    document.body.style.background = '#3E2723';
    return;
  }
  document.body.style.background = '';

  const views = { welcome: viewWelcome, builder: viewBuilder, success: viewSuccess, orders: viewOrders };
  el('main').innerHTML = (views[state.step] || viewWelcome)();
  bind();
}

function viewWelcome(){
  return `
  <section class="screen">
    <div class="hero">
      <div class="gift">🎁</div>
      <h1>Створи свій шоколад</h1>
      <p>Обери основу, додай начинки та декор — і ми виготовимо унікальну плитку ручної роботи саме для тебе.</p>
    </div>
    <div class="stack mt">
      <button class="btn btn-primary" data-act="start">🎮 Почати створення</button>
      <button class="btn btn-ghost" data-act="orders">📦 Мої замовлення</button>
    </div>
    ${state.error ? `<p style="text-align:center;color:#C62828;font-size:12px;margin-top:16px">${esc(state.error)}</p>` : ''}
  </section>`;
}

function chip(item, selected){
  const low = item.stock < 30;
  const disabled = item.stock <= 0;
  return `
    <button class="chip ${selected ? 'on' : ''}" data-item="${item.id}" ${disabled ? 'disabled' : ''}>
      <span class="n">${esc(item.name)}</span>
      <span class="p">${money(item.price)}</span>
      <span class="stock ${low ? 'low' : ''}">${disabled ? 'немає' : `${item.stock} од.`}</span>
    </button>`;
}

function section(title, num, items, selectedIds){
  if (!items.length) return '';
  return `
    <div class="section">
      <h3><span class="n">${num}</span> ${title}</h3>
      <div class="grid2">${items.map(i => chip(i, selectedIds.includes(i.id))).join('')}</div>
    </div>`;
}

function viewBuilder(){
  const ink = baseInk(state.base);
  const byCat = (c) => state.ingredients.filter(i => i.category === c);
  const fillIds = state.fillings.map(i => i.id);
  const topIds = state.toppings.map(i => i.id);

  return `
  <section class="screen">
    <div class="preview">
      <div class="label">Твоя плитка</div>
      <input class="name-input" id="choco-name" maxlength="40" value="${esc(state.name)}" placeholder="Назва плитки" />
      <div class="bar" style="background:${ink.bg};color:${ink.fg}">
        <div class="base">${esc(state.base?.name || 'Оберіть основу')}</div>
        ${state.fillings.length
          ? `<div class="fills">${state.fillings.map(f => esc(f.name)).join(' · ')}</div>`
          : `<div class="empty">без начинки</div>`}
        ${state.toppings.length ? `<div class="tops">✨ ${state.toppings.map(t => esc(t.name)).join(' · ')}</div>` : ''}
      </div>
    </div>

    ${section('Основа шоколаду', 1, byCat('base'), state.base ? [state.base.id] : [])}
    ${section('Начинки', 2, byCat('filling'), fillIds)}
    ${section('Декор', 3, byCat('topping'), topIds)}
  </section>

  <div class="bottom">
    <div class="sum"><small>Разом</small><b>${money(total())}</b></div>
    <div class="actions">
      <button class="btn btn-ghost btn-sm" data-act="back">Назад</button>
      <button class="btn btn-primary btn-sm" data-act="submit">Замовити 🍫</button>
    </div>
  </div>`;
}

function viewSuccess(){
  return `
  <section class="screen success">
    <div class="emoji">🎉</div>
    <h1 style="font-size:23px;margin:16px 0 8px">Замовлення прийнято!</h1>
    <p style="font-size:13.5px;color:var(--muted);line-height:1.6;margin:0 auto;max-width:320px">
      Майстри вже почали виготовлення твоєї унікальної плитки. Статус можна відстежувати у замовленнях.
    </p>
    <div class="stack mt">
      <button class="btn btn-primary" data-act="orders">📦 Мої замовлення</button>
      <button class="btn btn-ghost" data-act="home">🏠 На головну</button>
    </div>
  </section>`;
}

function viewOrders(){
  const labels = {
    created:['Створено','b-created'], preparing:['Готується','b-preparing'],
    delivering:['В дорозі','b-delivering'], completed:['Виконано','b-completed'],
  };
  const list = state.orders.length
    ? state.orders.map(o => {
        const [label, cls] = labels[o.status] || ['Невідомо','b-created'];
        const r = o.recipe || {};
        const base = r.base?.name || '—';
        const fills = (r.fillings || []).map(f => f.name).join(', ');
        return `
        <div class="order">
          <div class="oh">
            <span class="id">Замовлення #${o.id}</span>
            <span class="badge ${cls}">${label}</span>
          </div>
          <div class="meta">
            <div>Плитка: <b>${esc(r.name || '—')}</b></div>
            <div>Основа: ${esc(base)}${fills ? ` · ${esc(fills)}` : ''}</div>
          </div>
          <div class="total"><span>Сума</span><span>${money(o.totalPrice)}</span></div>
        </div>`;
      }).join('')
    : `<div class="empty">У тебе поки немає замовлень</div>`;

  return `
  <section class="screen">
    <div class="row-head">
      <h2>Мої замовлення</h2>
      <button class="link" data-act="home">&larr; На головну</button>
    </div>
    ${list}
  </section>`;
}

/* ----------------------------- Події ----------------------------- */
function bind(){
  document.querySelectorAll('[data-item]').forEach(node => {
    node.addEventListener('click', () => toggleItem(Number(node.dataset.item)));
  });

  document.querySelectorAll('[data-act]').forEach(node => {
    node.addEventListener('click', () => {
      const act = node.dataset.act;
      if (act === 'start') { state.step = 'builder'; haptic('select'); render(); }
      if (act === 'back')  { state.step = 'welcome'; render(); }
      if (act === 'home')  { state.step = 'welcome'; render(); }
      if (act === 'orders') { state.step = 'orders'; loadOrders(); }
      if (act === 'submit') submitOrder();
    });
  });

  const nameInput = el('choco-name');
  if (nameInput) {
    nameInput.addEventListener('input', (e) => { state.name = e.target.value; });
    nameInput.addEventListener('blur', () => {
      if (!state.name.trim()) state.name = 'Моя крафтова плитка';
      render();
    });
  }
}

function toggleItem(id){
  const item = state.ingredients.find(i => i.id === id);
  if (!item) return;

  if (item.category === 'base') {
    state.base = item;
    haptic('select');
  } else if (item.category === 'filling') {
    state.fillings = state.fillings.some(i => i.id === id)
      ? state.fillings.filter(i => i.id !== id)
      : [...state.fillings, item];
    haptic('select');
  } else {
    state.toppings = state.toppings.some(i => i.id === id)
      ? state.toppings.filter(i => i.id !== id)
      : [...state.toppings, item];
    haptic('select');
  }
  render();
}

/* ----------------------------- Запити ----------------------------- */
async function loadIngredients(){
  try {
    state.ingredients = await api('/ingredients');
    state.base = state.ingredients.find(i => i.category === 'base') || null;
    state.error = null;
  } catch (e) {
    state.error = 'Не вдалося завантажити інгредієнти. Перевір, чи запущений бекенд.';
  } finally {
    state.loading = false;
    render();
  }
}

async function loadOrders(){
  render();
  try {
    state.orders = await api(`/orders/user/${state.user.id}`);
  } catch (e) {
    state.orders = [];
    toast('Не вдалося завантажити замовлення');
  }
  render();
}

async function submitOrder(){
  if (!state.base) { toast('Обери основу шоколаду'); return; }
  const btn = document.querySelector('[data-act="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Надсилаємо…'; }

  try {
    await api('/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        telegram_id: state.user.id,
        username: state.user.username || 'user',
        first_name: state.user.first_name || 'User',
        recipe: {
          name: state.name.trim() || 'Моя крафтова плитка',
          base: state.base,
          fillings: state.fillings,
          toppings: state.toppings,
        },
        total_price: total(),
      }),
    });
    state.step = 'success';
    haptic('success');
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Замовити 🍫'; }
    toast('Не вдалося створити замовлення');
  }
}

/* ----------------------------- Старт ----------------------------- */
(function boot(){
  try {
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        const u = tg.initDataUnsafe.user;
        state.user = { id: u.id, username: u.username, first_name: u.first_name };
      }
    }
  } catch(_) {}
  render();
  loadIngredients();
})();
</script>
</body>
</html>
